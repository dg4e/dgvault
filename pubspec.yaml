name: dgvault
description: Cross-platform KeePass-compatible password manager (zero-knowledge).
publish_to: none
version: 0.8.5+7

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  # Vetted crypto primitives (Argon2, AES, ChaCha20) — no hand-rolled crypto.
  pointycastle: ^3.9.1
  # OS keystore wrapping for derived keys.
  flutter_secure_storage: ^9.2.2
  # Biometric / device-credential gate (Face ID / Touch ID / fingerprint).
  local_auth: ^2.3.0
  # HTTP client for network sync adapters (WebDAV, etc.).
  http: ^1.2.0
  # Native open/save file pickers (desktop + mobile).
  xml: ^6.5.0
  package_info_plus: ^9.0.1
  window_manager: ^0.5.1
  path_provider: ^2.1.6
  # Open donation profile links (About screen) in the system browser.
  url_launcher: ^6.3.0
  file_selector: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.25.0
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    # Donation brand logos (Simple Icons, CC0) shown on the About screen.
    - assets/brands/
  # Bundled monospace (OFL) so the terminal glyphs (box-drawing, arrows, ⌘)
  # render identically on every platform instead of falling back to a system
  # font that may lack them (renders as "?").
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
